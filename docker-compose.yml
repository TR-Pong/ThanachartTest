
services:
  postgres:
    image: postgres:17
    container_name: tanachat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tanachat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tanachat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
